<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B3A63"/>
      <stop offset="1" stop-color="#3E2244"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- memorandum = "to be remembered": an American spiral memo pad -->
  <rect x="120" y="128" width="272" height="300" rx="22" fill="#000" opacity=".22" transform="translate(0 10)"/>
  <rect x="120" y="128" width="272" height="300" rx="22" fill="#FBF7EE"/>
  <rect x="120" y="128" width="272" height="44" rx="22" fill="#E9604F"/>
  <rect x="120" y="150" width="272" height="22" fill="#E9604F"/>
  <!-- ruled lines + red margin -->
  <g stroke="#9DBBE0" stroke-width="7" stroke-linecap="round">
    <line x1="150" y1="226" x2="362" y2="226"/>
    <line x1="150" y1="276" x2="362" y2="276"/>
    <line x1="150" y1="326" x2="362" y2="326"/>
    <line x1="150" y1="376" x2="300" y2="376"/>
  </g>
  <line x1="188" y1="186" x2="188" y2="414" stroke="#E9604F" stroke-width="5" opacity=".75"/>
  <!-- handwritten "M" -->
  <path d="M212 262 L230 200 L254 244 L278 200 L296 262" fill="none" stroke="#3E2244" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- spiral rings -->
  <g fill="none" stroke="#D9D4E0" stroke-width="10" stroke-linecap="round">
    <path d="M158 140 v-26 a12 12 0 0 1 24 0 v26"/>
    <path d="M214 140 v-26 a12 12 0 0 1 24 0 v26"/>
    <path d="M270 140 v-26 a12 12 0 0 1 24 0 v26"/>
    <path d="M326 140 v-26 a12 12 0 0 1 24 0 v26"/>
    
  </g>
</svg>
